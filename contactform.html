<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
</head>
<body>
    <h1>Contact Form</h1>
    <form>
        <div>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="firstname" placeholder="Your name.." required>
        </div>
        
        <div>
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lastname" placeholder="Your last name.." required>
        </div>
        
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email.." required>
        </div>
        
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Your phone number.." required>
        </div>
        
        <div>
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Street address.." required>
        </div>
        
        <div>
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Your city.." required>
        </div>
        
        <div>
            <label for="postalcode">Postal Code</label>
            <input type="text" id="postalcode" name="postalcode" placeholder="Postal code.." required>
        </div>
        
        <div>
            <label for="country">Country</label>
            <select id="country" name="country">
                <option value="finland">Finland</option>
                <option value="sweden">Sweden</option>
                <option value="norway">Norway</option>
            </select>
        </div>
        
        <div>
            <label>Feedback Type</label><br>
            <input type="radio" id="complaint" name="feedback" value="complaint">
            <label for="complaint">Complaint</label>
            <input type="radio" id="suggestion" name="feedback" value="suggestion">
            <label for="suggestion">Suggestion</label>
            <input type="radio" id="other" name="feedback" value="other">
            <label for="other">Other</label>
        </div>
        
        <div>
            <label for="subject">Subject</label>
            <textarea id="subject" name="subject" placeholder="Write something.." rows="4" required></textarea>
        </div>
        
        <button type="submit">Submit Form</button>
    </form>
    <title>ÄlyX Oy - Pulmapelien valmistaja</title>
  

</body>
</html>
